# Publish to PyPI on version tags via Trusted Publishing (OIDC).
#
# One-time setup on https://pypi.org  ->  Account -> Publishing:
#   register this repository (tkatsuoka/autosi) with workflow name
#   release.yml and environment name pypi. No API token is needed.
#
# To release: bump `version` in pyproject.toml, then
#   git tag v0.1.0 && git push --tags

name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
