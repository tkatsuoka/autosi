[project]
name = "autosi"
version = "0.1.0"
description = "Automatic Selective Inference"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Teruyuki Katsuoka", email = "teruyuki.katsuoka@gmail.com" }]
dependencies = [
    "numpy>=1.26.4",
    "sicore>=3.0.0",
]
keywords = [
    "selective-inference",
    "post-selection-inference",
    "statistics",
    "hypothesis-testing",
    "feature-selection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/tkatsuoka/autosi"
Documentation = "https://tkatsuoka.github.io/autosi/"

[dependency-groups]
docs = [
    "sphinx>=8.0",
    "shibuya",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
